<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Todo App</title>

<style>
body{
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
    padding:20px;
}

.container{
    width:100%;
    max-width:700px;
    margin:auto;
}

h1{
    text-align:center;
    color:#00ff99;
}

.counter{
    text-align:center;
    margin-bottom:20px;
}

form{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

input[type=text]{
    flex:1;
}

input,button{
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

button{
    background:#00ff99;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

#searchInput{
    width:100%;
    box-sizing:border-box;
    margin-bottom:20px;
}

.task-card{
    background:#1f1f1f;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.task-name{
    flex:1;
    margin-left:15px;
    font-size:22px;
    word-break:break-word;
}

.delete{
    background:red;
    color:white;
    text-decoration:none;
    padding:10px 15px;
    border-radius:10px;
}

@media(max-width:600px){

.task-card{
    flex-direction:row;
}

.task-name{
    font-size:18px;
}

}
</style>

<script>
function searchTasks(){
    let input =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    let cards =
        document.getElementsByClassName("task-card");

    for(let i=0;i<cards.length;i++){

        let text =
            cards[i]
            .innerText
            .toLowerCase();

        if(text.includes(input)){
            cards[i].style.display="flex";
        }else{
            cards[i].style.display="none";
        }
    }
}
</script>

</head>
<body>

<div class="container">

<h1>📋 My Todo App</h1>

<div class="counter">
Total Tasks: {{ count }}
<br>
Completed: {{ completed_count }}
</div>

<form action="/add" method="post">
    <input type="text" name="task" placeholder="New task" required>
    <input type="date" name="due_date">
    <button type="submit">Add</button>
</form>

<input
type="text"
id="searchInput"
placeholder="Search tasks..."
onkeyup="searchTasks()"
>

{% for todo in todos %}

<div class="task-card">

<input
type="checkbox"
{% if todo[2] %}checked{% endif %}
onchange="window.location='/toggle/{{ todo[0] }}'"
>

<div class="task-name">
{{ todo[1] }}

{% if todo[3] %}
<br>
<small>📅 Due: {{ todo[3] }}</small>
{% endif %}
</div>

<a class="delete"
href="/delete/{{ todo[0] }}">
🗑 Delete
</a>

</div>

{% endfor %}

</div>

</body>
</html>
