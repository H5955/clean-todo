<!DOCTYPE html>
<html>
<head>
    <title>🚀 My Todo App</title>

    <style>
        body{
            background:#000;
            color:white;
            font-family:Arial,sans-serif;
            max-width:700px;
            margin:auto;
            padding:20px;
        }

        h1{
            text-align:center;
            color:#00ff99;
            font-size:42px;
        }

        form{
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:15px;
            border:none;
            border-radius:10px;
            font-size:18px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:15px;
            margin-top:10px;
            border:none;
            border-radius:10px;
            background:#00ff99;
            color:black;
            font-size:18px;
            font-weight:bold;
            cursor:pointer;
        }

        .task{
            background:#1e1e1e;
            padding:15px;
            margin-top:15px;
            border-radius:15px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .task-name{
            font-size:22px;
            word-break:break-word;
        }

        .delete{
            background:red;
            color:white;
            text-decoration:none;
            padding:10px 15px;
            border-radius:10px;
            font-size:20px;
        }

        hr{
            border:1px solid #333;
        }
    </style>
</head>

<body>

    <h1>🚀 My Todo App</h1>

    <form action="/add" method="post">
        <input
            type="text"
            name="task"
            placeholder="Enter a task..."
            required
        >

        <button type="submit">
            ➕ Add Task
        </button>
    </form>

    <hr>

    {% for todo in todos %}
    <div class="task">
        <div class="task-name">
            {{ todo[1] }}
        </div>
