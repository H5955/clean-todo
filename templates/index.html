<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🚀 My Todo App</title>

<style>
body{
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
    margin:0;
    padding:20px;
}

.container{
    width:100%;
    max-width:100%;
}

h1{
    text-align:center;
    color:#00ff99;
    font-size:42px;
}

.counter{
    text-align:center;
    color:#ccc;
    margin-bottom:20px;
}

form{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:15px;
}

input,
select,
button{
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:16px;
}

input[type=text]{
    flex:1;
}

button{
    background:#00ff99;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

#searchInput{
    width:100%;
    box-sizing:border-box;
    margin-bottom:20px;
}

.task-card{
    background:#1e1e1e;
    padding:15px;
    border-radius:15px;
    margin-bottom:15px;
    width:100%;
    box-sizing:border-box;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.task-name{
    flex:1;
    margin-left:15px;
    font-size:22px;
    word-break:break-word;
}

.delete{
    background:red;
    color:white;
    text-decoration:none;
    padding:10px 15px;
    border-radius:10px;
}

@media(max-width:600px){

    h1{
        font-size:32px;
    }

    form{
        flex-direction:column;
    }

    input,
    select,
    button{
        width:100%;
        box-sizing:border-box;
    }

    .task-card{
        flex-direction:column;
        align-items:flex-start;
    }

    .delete{
        width:100%;
        text-align:center;
    }
}
</style>

<script>
function searchTasks(){
    let input =
        document.getElementById("searchInput")
        .value
        .toLowerCase();

    let cards =
        document.getElementsByClassName("task-card");

    for(let i=0;i<cards.length;i++){

        let text =
            cards[i].innerText.toLowerCase();

        if(text.includes(input)){
            cards[i].style.display="";
        }else{
            cards[i].style.display="none";
        }
    }
}
</script>

</head>

<body>

<div class="container">

<h1>🚀 My Todo App</h1>

<div class="counter">
Total Tasks: {{ count }}
</div>

<form action="/add" method="post">

<input
type="text"
name="task"
placeholder="Enter a task..."
required>

<button type="submit">
➕ Add
</button>

</form>

<input
type="text"
id="searchInput"
placeholder="Search tasks..."
onkeyup="searchTasks()">

{% for todo in todos %}

<div class="task-card">

<a href="/toggle/{{ todo[0] }}">
    <input type="checkbox" {% if todo[2] %}checked{% endif %}>
</a>

<div class="task-name">
{{ todo[1] }}
</div>

<a class="delete"
href="/delete/{{ todo[0] }}">
🗑 Delete
</a>

</div>

{% endfor %}

</div>

</body>
</html>
