<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚀 My Todo App</title>

<style>
body{
    background:#000;
    color:white;
    font-family:Arial,sans-serif;
    max-width:700px;
    margin:auto;
    padding:20px;
}

h1{
    color:#00ff99;
    text-align:center;
}

h3{
    text-align:center;
}

form{
    display:flex;
    flex-direction:column;
    gap:10px;
}

input{
    padding:15px;
    border:none;
    border-radius:10px;
    font-size:18px;
}

button{
    padding:15px;
    border:none;
    border-radius:10px;
    background:#00ff99;
    color:black;
    font-size:18px;
    font-weight:bold;
}

.task{
    background:#1e1e1e;
    padding:15px;
    margin-top:15px;
    border-radius:15px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.task-name{
    font-size:22px;
    word-break:break-word;
}

.delete{
    background:red;
    color:white;
    text-decoration:none;
    padding:10px 15px;
    border-radius:10px;
}
</style>

</head>

<body>

<h1>🚀 My Todo App</h1>

<h3>Total Tasks: {{ count }}</h3>

<form action="/add" method="post">
    <input
        type="text"
        name="task"
        placeholder="Enter a task..."
        required
    >

    <button type="submit">
        ➕ Add Task
    </button>
</form>

<hr>

{% for todo in todos %}
<div class="task">

    <div class="task-name">
        {{ todo[1] }}
    </div>

    <a class="delete" href="/delete/{{ todo[0] }}">
        🗑 Delete
    </a>

</div>
{% endfor %}

</body>
</html>
